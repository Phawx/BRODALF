name: C core

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          "-DBRODALF_BUILD_ID=${{ github.sha }}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload the Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: brodalf-windows
          path: |
            build/Release/brodalf.exe
            build/Release/brodalf-cli.exe

  # Each push to master whose version (project() in CMakeLists.txt) has no
  # release yet publishes the Windows app as release v<version>. Bump the
  # version to cut the next one.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(sed -n 's/^project(brodalf VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then echo "new=0" >> "$GITHUB_OUTPUT"; else echo "new=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.new == '1'
        with:
          name: brodalf-windows
          path: dist
      - name: Publish the release
        if: steps.ver.outputs.new == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cp README.md dist/
          (cd dist && zip -9 "../brodalf-$TAG-windows-x64.zip" *)
          gh release create "$TAG" "brodalf-$TAG-windows-x64.zip" --target "$GITHUB_SHA" \
            --title "BRODALF $TAG" --notes-file .github/release-notes.md
