name: C core

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          "-DBRODALF_ONEDRIVE_CLIENT_ID=${{ vars.BRODALF_ONEDRIVE_CLIENT_ID }}"
          "-DBRODALF_DROPBOX_CLIENT_ID=${{ vars.BRODALF_DROPBOX_CLIENT_ID }}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload the Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: brodalf-windows
          path: |
            build/Release/brodalf.exe
            build/Release/brodalf-cli.exe
