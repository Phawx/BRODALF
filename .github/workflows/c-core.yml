name: C core

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          "-DBRODALF_ONEDRIVE_CLIENT_ID=${{ vars.BRODALF_ONEDRIVE_CLIENT_ID }}"
          "-DBRODALF_DROPBOX_CLIENT_ID=${{ vars.BRODALF_DROPBOX_CLIENT_ID }}"
          "-DBRODALF_BUILD_ID=${{ github.sha }}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload the Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: brodalf-windows
          path: |
            build/Release/brodalf.exe
            build/Release/brodalf-cli.exe

  # A tag like v0.2.0 publishes the Windows app as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: brodalf-windows
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp README.md dist/
          (cd dist && zip -9 "../brodalf-${GITHUB_REF_NAME}-windows-x64.zip" *)
          gh release create "$GITHUB_REF_NAME" "brodalf-${GITHUB_REF_NAME}-windows-x64.zip" \
            --title "BRODALF ${GITHUB_REF_NAME}" --notes-file .github/release-notes.md
