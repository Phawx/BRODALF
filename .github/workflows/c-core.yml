name: C core

# Every push builds and tests, on any branch. A release is made only when
# someone starts it by hand (Actions > C core > Run workflow), never because
# a push or a version number changed.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the Windows app as release v<version> (the version in CMakeLists.txt)"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the translations
        if: runner.os == 'Linux'
        run: python3 tools/lang.py check
      # Builds the installer script around stand-in files, so a mistake in
      # it shows here and not first when a release is made.
      - name: Check the installer script
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nsis
          mkdir -p /tmp/nsis-check && touch /tmp/nsis-check/brodalf.exe /tmp/nsis-check/brodalf-cli.exe
          v="$(sed -n 's/^project(brodalf VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          makensis -V2 "-DVERSION=$v" "-DBINDIR=/tmp/nsis-check" "-DOUTFILE=/tmp/nsis-check/setup.exe" installer/brodalf.nsi
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          "-DBRODALF_BUILD_ID=${{ github.sha }}"
      - name: Build
        run: cmake --build build --config Release --parallel
      # Real FAT32 and exFAT volumes (small virtual disks, attached and
      # given drive letters) and a share of this PC, for
      # tests/test_windows_volumes.c, which fails on CI without them.
      - name: Make FAT32 and exFAT volumes and a share
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "brodalf-volumes"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $used = (Get-PSDrive -PSProvider FileSystem).Name
          $free = @([char[]](90..70) | ForEach-Object { [string]$_ } | Where-Object { $used -notcontains $_ })
          function New-Volume([string] $name, [string] $fs, [string] $unit, [string] $letter) {
            $vhd = Join-Path $dir "$name.vhdx"
            $script = Join-Path $dir "$name.txt"
            Set-Content -Path $script -Encoding Ascii -Value @(
              "create vdisk file=`"$vhd`" maximum=320 type=expandable",
              "select vdisk file=`"$vhd`"", "attach vdisk", "create partition primary",
              "format fs=$fs quick label=$name unit=$unit", "assign letter=$letter")
            $out = & diskpart.exe /s $script
            Write-Host ($out -join "`n")
            if ($LASTEXITCODE -ne 0) { throw "diskpart $name failed with exit code $LASTEXITCODE" }
            for ($i = 0; $i -lt 60 -and -not (Test-Path "${letter}:\"); $i++) { Start-Sleep -Milliseconds 500 }
            if (-not (Test-Path "${letter}:\")) { throw "${letter}: did not appear" }
          }
          New-Volume "BDFAT32" "fat32" "4096" $free[0]
          New-Volume "BDEXFAT" "exfat" "32K" $free[1]
          $share = Join-Path $dir "share"
          New-Item -ItemType Directory -Force -Path $share | Out-Null
          New-SmbShare -Name BrodalfTest -Path $share -FullAccess Everyone | Out-Null
          Get-Volume -DriveLetter $free[0], $free[1] | Format-Table DriveLetter, FileSystem, Size, SizeRemaining, AllocationUnitSize
          Add-Content -Path $env:GITHUB_ENV -Value @(
            "BRODALF_TEST_FAT32=$($free[0]):\", "BRODALF_TEST_FAT32_UNIT=4096",
            "BRODALF_TEST_EXFAT=$($free[1]):\", "BRODALF_TEST_EXFAT_UNIT=32768",
            "BRODALF_TEST_SHARE=\\localhost\BrodalfTest", "BRODALF_TEST_SHARE_DIR=$share")
      - name: Test
        if: runner.os == 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure
      # On Windows the checks of real disks, shadow copies, volumes and the
      # share run on their own, with all they print, which says what this
      # machine's disks, volumes and share are.
      - name: Test
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure -E "^(flow_tests|windows_volumes)$"
      - name: Test on real disks, shadow copies, FAT32, exFAT and a share
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release -V -R "^(flow_tests|windows_volumes)$"
      - name: Upload the Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: brodalf-windows
          path: |
            build/Release/brodalf.exe
            build/Release/brodalf-cli.exe

  # Only when started by hand with "release" ticked: publishes the Windows
  # app as release v<version>, if that release does not exist yet.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(sed -n 's/^project(brodalf VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then echo "new=0" >> "$GITHUB_OUTPUT"; else echo "new=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.new == '1'
        with:
          name: brodalf-windows
          path: dist
      - name: Publish the release
        if: steps.ver.outputs.new == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nsis
          makensis -V2 "-DVERSION=${TAG#v}" "-DBINDIR=$PWD/dist" "-DOUTFILE=$PWD/brodalf-$TAG-windows-x64-setup.exe" installer/brodalf.nsi
          cp README.md THIRD-PARTY-NOTICES.txt dist/
          (cd dist && zip -9 "../brodalf-$TAG-windows-x64.zip" *)
          gh release create "$TAG" "brodalf-$TAG-windows-x64.zip" "brodalf-$TAG-windows-x64-setup.exe" --target "$GITHUB_SHA" \
            --title "BRODALF $TAG" --notes-file .github/release-notes.md
